[project]
name = "ballast"
version = "0.1.0"
description = "Volatility-managed portfolios: the in-sample result and the real-time rebuttal, both reproduced."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scipy==1.15.3",
    "matplotlib==3.10.3",
]

[dependency-groups]
dev = [
    "pytest==8.4.0",
    "ruff==0.11.13",
    "mypy==1.16.0",
    "statsmodels==0.14.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ballast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "scipy.*", "pandas.*"]
ignore_missing_imports = true
